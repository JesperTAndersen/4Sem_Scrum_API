name: Build and deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and check coverage
        run: mvn --batch-mode --update-snapshots verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: SonarQube analysis
        run: mvn --batch-mode sonar:sonar -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/scrum-project-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/scrum-project-api:${{ github.sha }}

      - name: Trigger Watchtower webhook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WATCHTOWER_SSH_KEY: ${{ secrets.WATCHTOWER_SSH_KEY }}
          WATCHTOWER_DROPLET_IP: ${{ secrets.WATCHTOWER_DROPLET_IP }}
          WATCHTOWER_DROPLET_USER: ${{ secrets.WATCHTOWER_DROPLET_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$WATCHTOWER_SSH_KEY" > ~/.ssh/watchtower_deploy
          chmod 600 ~/.ssh/watchtower_deploy
          ssh-keyscan -H "$WATCHTOWER_DROPLET_IP" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/watchtower_deploy "$WATCHTOWER_DROPLET_USER@$WATCHTOWER_DROPLET_IP"